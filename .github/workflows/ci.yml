name: RustAssay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test
      - run: cargo build --locked --bin rust-assay
      - run: target/debug/rust-assay check examples/clean/src/domain --json
      - name: Require a finding in the violating specimen
        shell: bash
        run: |
          checker_exit=0
          target/debug/rust-assay check examples/violations/src/domain --json || checker_exit=$?
          if [ "$checker_exit" -ne 1 ]; then
            printf 'Expected RustAssay findings exit 1, observed %s\n' "$checker_exit" >&2
            exit 1
          fi
